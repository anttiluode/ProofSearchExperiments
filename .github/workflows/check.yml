name: Reproduce and check proof terms
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce CPU experiments
        run: |
          node experiment.cjs
          node phase_buckets.cjs
          node accounting_audit.cjs
          node emit_lean.cjs
          node fatigue.cjs
          node fatigue_dp.cjs
          node operator.cjs
          node operator_twc.cjs
          node operator_index.cjs
          node operator_lazy.cjs
          node rotation_orbit.cjs
          node rotation_continuous.cjs
          node rotation_lm.cjs
          node rotation_lie.cjs
      - name: Install pinned Lean via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify Lean certificates and wrong-witness control
        run: |
          node check_lean.cjs
          lean results/FatigueCertificates.lean
          lean results/FatigueDP.lean
          echo 'Lean accepted fatigue scheduler and suffix-elimination certificates.'
          if lean results/FatigueWrongWitness.lean > wrong.log 2>&1; then cat wrong.log; exit 1; fi
          grep -i 'type mismatch' wrong.log
          lean results/OperatorCertificates.lean
          echo 'Lean accepted 3 learned schemas and 144 target normalizer certificates.'
          if lean results/OperatorWrongOrder.lean > operator_wrong.log 2>&1; then cat operator_wrong.log; exit 1; fi
          grep -Ei 'type mismatch|not definitionally equal' operator_wrong.log
          lean results/OperatorIndexCertificates.lean
          echo 'Lean accepted 4 operator schemas and 498 indexed replay certificates.'
          lean results/RotationAlgebra.lean
          lean results/RotationRuleObligations.lean
          lean results/RotationDiscoveryObligations.lean
          lean results/RotationReuseObligations.lean
          lean results/RotationLineageObligations.lean
